services:
  app:
    build: .
    image: ooo-trajectory-reviewer:latest
    # 宿主端口可通过环境变量 HOST_PORT 配置，默认 8080
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 一次性校验服务：运行单元测试、构建检查与 API/HTTP 冒烟后退出并返回结果码。
  # 用法： docker compose run --rm verify
  verify:
    build: .
    image: ooo-trajectory-reviewer:latest
    command: ["bash", "scripts/verify.sh"]
    environment:
      - SMOKE_URL=http://app:8080
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
